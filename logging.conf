[loggers]
keys=root,django,django.request,django.security,collecte

[handlers]
keys=console,file,security_file,error_file

[formatters]
keys=verbose,simple,json

[formatter_verbose]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_simple]
format=%(asctime)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_json]
class=pythonjsonlogger.jsonlogger.JsonFormatter
format=%(asctime)s %(name)s %(levelname)s %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[handler_console]
class=logging.StreamHandler
level=INFO
formatter=verbose
args=(sys.stdout,)

[handler_file]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=json
args=('logs/app.log', 'a', 10*1024*1024, 5, 'utf-8')

[handler_security_file]
class=logging.handlers.RotatingFileHandler
level=WARNING
formatter=json
args=('logs/security.log', 'a', 10*1024*1024, 5, 'utf-8')

[handler_error_file]
class=logging.handlers.RotatingFileHandler
level=ERROR
formatter=json
args=('logs/error.log', 'a', 10*1024*1024, 5, 'utf-8')

[logger_root]
level=INFO
handlers=console,file,error_file

[logger_django]
level=INFO
handlers=file,console
propagate=0
qualname=django

[logger_django.request]
level=WARNING
handlers=file,error_file,security_file
propagate=0
qualname=django.request

[logger_django.security]
level=WARNING
handlers=security_file,error_file
propagate=0
qualname=django.security

[logger_collecte]
level=INFO
handlers=file,console,error_file
propagate=0
qualname=collecte
