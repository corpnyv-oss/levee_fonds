services:
  - type: web
    name: fapag-collecte
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn fapag_collecte_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.10
      - key: DJANGO_SETTINGS_MODULE
        value: fapag_collecte_backend.settings
      - key: PYTHONUNBUFFERED
        value: "True"
      - key: GUNICORN_CMD_ARGS
        value: "--workers 4 --worker-class gthread --threads 2 --timeout 120"
    plan: free
    region: frankfurt  # Pour une meilleure latence avec l'Europe
    autoDeploy: true
