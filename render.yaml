services:
  - type: web
    name: fapag-collecte-api
    env: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn fapag_collecte_backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: fapag_collecte_backend.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fapag-collecte-db
          property: connectionString
      - key: WEBHOOK_ALLOWED_IPS
        value: "127.0.0.1,::1"
      - key: WEBHOOK_TIMESTAMP_WINDOW
        value: "300"
      - key: RATE_LIMIT_AUTH
        value: "5"
      - key: RATE_LIMIT_AUTH_WINDOW
        value: "300"
      - key: RATE_LIMIT_PARTICIPATIONS
        value: "10"
      - key: RATE_LIMIT_WEBHOOKS
        value: "100"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DEBUG
        value: "False"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://fapag-collecte-api.onrender.com"

databases:
  - name: fapag-collecte-db
    databaseName: fapag_collecte
    user: fapag_collecte_user
    plan: starter
